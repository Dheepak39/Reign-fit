<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Get Reign — Redirecting to Google Play</title>
  <meta name="description" content="Download Reign on Google Play." />

  <!-- Redirect to Google Play. Meta refresh is the fallback for browsers that block JS. -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.reign.app" />
  <link rel="canonical" href="https://play.google.com/store/apps/details?id=com.reign.app" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple:     #7C3AED;
      --purple-l:   #A78BFA;
      --near-black: #06060C;
      --surface:    #0E0E18;
      --off-white:  #F2F0F8;
      --muted:      #94A3B8;
      --border:     rgba(124,58,237,0.16);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--near-black);
      color: var(--off-white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .box { max-width: 360px; }
    .logo {
      width: 64px; height: 64px;
      object-fit: contain;
      margin: 0 auto 28px;
      display: block;
      filter: drop-shadow(0 0 24px rgba(124,58,237,0.4));
    }
    .spinner {
      width: 26px; height: 26px;
      border: 2.5px solid rgba(124,58,237,0.25);
      border-top-color: var(--purple-l);
      border-radius: 50%;
      margin: 0 auto 22px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }
    p { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 26px; }
    a.btn {
      display: inline-block;
      background: var(--purple);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 13px 28px;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(124,58,237,0.4);
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="../logo.png" alt="Reign" class="logo" />
    <div class="spinner"></div>
    <h1>Taking you to Google Play…</h1>
    <p>If you aren't redirected automatically, tap the button below.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.reign.app">Open in Google Play</a>
  </div>

  <script>
    // Primary redirect. Runs immediately so it also works inside in-app
    // browsers (e.g. Instagram) where direct Play Store links can be blocked.
    window.location.replace("https://play.google.com/store/apps/details?id=com.reign.app");
  </script>
</body>
</html>
